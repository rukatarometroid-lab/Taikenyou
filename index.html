<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE VIP ROOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    :root {
      --gold-metallic: linear-gradient(135deg, #fcedc5 0%, #d19e53 25%, #f3d492 50%, #a6742a 80%, #ffd993 100%);
      --gold-solid: #d19e53;
      --gold-bright: #fcd58c;
      --casino-bg: radial-gradient(circle at 50% 35%, #220505 0%, #050101 70%, #000000 100%);
      --card-bg: linear-gradient(135deg, #150707 0%, #050000 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #000; color: #f7f3eb; font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden; height: 100vh; width: 100vw; user-select: none;
    }
    .cinema-text { font-family: 'Cinzel', serif; letter-spacing: 0.15em; }

    /* ロビー UI */
    .lobby-wrap {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px; background: var(--casino-bg);
    }
    .lobby-title { font-size: 2.2rem; background: var(--gold-metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; text-align: center; }
    .lobby-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 900px; }
    
    @media (max-width: 768px) {
      .lobby-cards { grid-template-columns: 1fr; max-width: 320px; }
      .lobby-card { height: 110px !important; }
      .lobby-title { font-size: 1.6rem; }
    }

    .lobby-card {
      background: var(--card-bg); border: 1.5px solid rgba(209, 158, 83, 0.4); border-radius: 4px;
      height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .lobby-card:hover { border-color: var(--gold-bright); transform: translateY(-3px); box-shadow: 0 0 15px rgba(209,158,83,0.4); }
    .card-icon { font-size: 2.5rem; margin-bottom: 8px; color: var(--gold-solid); }
    .card-name { font-size: 1rem; font-weight: 700; color: #fff; }

    /* ゲーム共通 UI */
    .screen { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--casino-bg); }
    .table-rim { position: absolute; top: 0; width: 100%; height: 15px; background: #100; border-bottom: 2px solid var(--gold-solid); }
    .exit-btn { position: absolute; top: 25px; left: 25px; background: #000; border: 1px solid var(--gold-solid); color: var(--gold-solid); padding: 6px 16px; font-size: 0.75rem; font-weight: bold; cursor: pointer; z-index: 10; }
    
    .game-content { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 20px 20px; gap: 15px; overflow-y: auto; }
    .hud-bar { display: flex; justify-content: space-between; width: 100%; max-width: 600px; background: rgba(0,0,0,0.6); border: 1px solid rgba(209,158,83,0.3); padding: 10px 20px; border-radius: 4px; font-weight: bold; }
    .gold-val { color: var(--gold-bright); }
    
    .table-board { background: rgba(15, 4, 4, 0.95); border: 2px solid var(--gold-solid); width: 100%; max-width: 600px; padding: 20px; border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
    .status-msg { font-size: 1rem; color: var(--gold-bright); text-align: center; font-weight: bold; min-height: 24px; margin-bottom: 15px; }

    /* コントロール */
    .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid rgba(209,158,83,0.2); padding-top: 15px; gap: 10px; }
    .chip-selector { display: flex; gap: 8px; }
    .chip-btn { width: 36px; height: 36px; border-radius: 50%; background: #222; border: 2px solid var(--gold-solid); color: var(--gold-bright); font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    .chip-btn.selected { background: var(--gold-metallic); color: #000; border-color: #fff; }
    .action-group { display: flex; gap: 8px; }
    .btn-action { background: #111; border: 1px solid var(--gold-solid); color: #fff; padding: 8px 16px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 2px; }
    .btn-main { background: linear-gradient(to bottom, #9d1a1a, #5a0505); border-color: #ffd993; }

    /* 各ゲーム専用スタイル */
    /* シックボー */
    .sb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .sb-cell { background: rgba(0,0,0,0.4); border: 1px solid rgba(209,158,83,0.3); padding: 15px; text-align: center; border-radius: 4px; cursor: pointer; }
    .sb-cell.win { background: rgba(157,26,26,0.6) !important; border-color: #fff; }
    .chip-pot { min-height: 24px; margin-top: 5px; display: flex; justify-content: center; }
    .placed-chip { background: radial-gradient(circle, #ffd993, #a6742a); color: #000; font-size: 0.7rem; font-weight: 900; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .cup-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .dice-visual { width: 32px; height: 32px; background: #fff; color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; }

    /* ブラックジャック & インディアンポーカー */
    .card-display-area { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .card-slot { text-align: center; }
    .card-title { font-size: 0.8rem; color: #8a735d; margin-bottom: 5px; }
    .cards-row { display: flex; gap: 5px; min-height: 80px; justify-content: center; }
    .casino-card { width: 55px; height: 80px; background: #fff; color: #000; border-radius: 4px; border: 1px solid #ccc; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    .casino-card.red { color: #9d1a1a; }
    .casino-card.back { background: linear-gradient(135deg, #5a0505, #110000); border-color: var(--gold-solid); color: transparent; }
    .bj-bet-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(209,158,83,0.3); border-radius: 4px; padding: 15px; text-align: center; cursor: pointer; }
  </style>
</head>
<body>

  <!-- メインロビー -->
  <div id="lobby-screen" class="lobby-wrap">
    <h1 class="lobby-title cinema-text">VIP CASINO CLUB</h1>
    <div class="lobby-cards">
      <div class="lobby-card" onclick="openGame('sicbo-screen')">
        <div class="card-icon">🎲</div>
        <div class="card-name cinema-text">SIC BO</div>
      </div>
      <div class="lobby-card" onclick="openGame('bj-screen')">
        <div class="card-icon">♠</div>
        <div class="card-name cinema-text">BLACKJACK</div>
      </div>
      <div class="lobby-card" onclick="openGame('ip-screen')">
        <div class="card-icon">🃏</div>
        <div class="card-name cinema-text">INDIAN POKER</div>
      </div>
    </div>
  </div>

  <!-- 1. SIC BO (大小) -->
  <div id="sicbo-screen" class="screen">
    <div class="table-rim"></div>
    <button class="exit-btn" onclick="backToLobby()">LOBBY</button>
    <div class="game-content">
      <div class="hud-bar">
        <div>CREDIT: <span class="gold-val wallet-lbl">1000</span></div>
        <div>TOTAL BET: <span id="sb-bet-total">0</span></div>
      </div>
      <div class="table-board">
        <div class="cup-area">
          <div class="dice-visual" id="sb-d1">?</div>
          <div class="dice-visual" id="sb-d2">?</div>
          <div class="dice-visual" id="sb-d3">?</div>
        </div>
        <div class="status-msg" id="sb-msg">PLACE YOUR BETS</div>
        <div class="sb-grid">
          <div class="sb-cell" id="sb-cell-small" onclick="sbPlace('small')">
            <div>小 (4-10) 1:1</div>
            <div class="chip-pot" id="sb-pot-small"></div>
          </div>
          <div class="sb-cell" id="sb-cell-big" onclick="sbPlace('big')">
            <div>大 (11-17) 1:1</div>
            <div class="chip-pot" id="sb-pot-big"></div>
          </div>
        </div>
        <div class="ctrl-row">
          <div class="chip-selector">
            <button class="chip-btn selected" onclick="setChip(10, this)">10</button>
            <button class="chip-btn" onclick="setChip(50, this)">50</button>
            <button class="chip-btn" onclick="setChip(100, this)">100</button>
          </div>
          <div class="action-group">
            <button class="btn-action" onclick="sbClear()">CLEAR</button>
            <button class="btn-action btn-main" onclick="sbRoll()">ROLL</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. BLACKJACK -->
  <div id="bj-screen" class="screen">
    <div class="table-rim"></div>
    <button class="exit-btn" onclick="backToLobby()">LOBBY</button>
    <div class="game-content">
      <div class="hud-bar">
        <div>CREDIT: <span class="gold-val wallet-lbl">1000</span></div>
        <div>BET: <span id="bj-bet-lbl">0</span></div>
      </div>
      <div class="table-board">
        <div class="card-display-area">
          <div class="card-slot">
            <div class="card-title">DEALER (<span id="bj-d-score">?</span>)</div>
            <div class="cards-row" id="bj-dealer-cards"></div>
          </div>
          <div class="card-slot">
            <div class="card-title">PLAYER (<span id="bj-p-score">0</span>)</div>
            <div class="cards-row" id="bj-player-cards"></div>
          </div>
        </div>
        <div class="status-msg" id="bj-msg">PLACE BET & DEAL</div>
        <div class="bj-bet-box" id="bj-bet-zone" onclick="bjPlace()">
          <div>BET HERE TO PLAY</div>
          <div class="chip-pot" id="bj-pot"></div>
        </div>
        <div class="ctrl-row">
          <div class="chip-selector">
            <button class="chip-btn selected" onclick="setChip(10, this)">10</button>
            <button class="chip-btn" onclick="setChip(50, this)">50</button>
            <button class="chip-btn" onclick="setChip(100, this)">100</button>
          </div>
          <div class="action-group">
            <button class="btn-action" id="btn-bj-hit" onclick="bjHit()" disabled>HIT</button>
            <button class="btn-action" id="btn-bj-stand" onclick="bjStand()" disabled>STAND</button>
            <button class="btn-action btn-main" id="btn-bj-deal" onclick="bjDeal()">DEAL</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. INDIAN POKER -->
  <div id="ip-screen" class="screen">
    <div class="table-rim"></div>
    <button class="exit-btn" onclick="backToLobby()">LOBBY</button>
    <div class="game-content">
      <div class="hud-bar">
        <div>CREDIT: <span class="gold-val wallet-lbl">1000</span></div>
        <div>BET: <span id="ip-bet-lbl">0</span></div>
      </div>
      <div class="table-board">
        <div class="card-display-area">
          <div class="card-slot">
            <div class="card-title">OPPONENT CARD</div>
            <div class="cards-row" id="ip-opp-cards"></div>
          </div>
          <div class="card-slot">
            <div class="card-title">YOUR CARD (BLIND)</div>
            <div class="cards-row" id="ip-my-cards"></div>
          </div>
        </div>
        <div class="status-msg" id="ip-msg">BET OR FOLD. YOU SEE OPPONENT'S CARD.</div>
        <div class="ctrl-row">
          <div class="chip-selector">
            <button class="chip-btn selected" onclick="setChip(10, this)">10</button>
            <button class="chip-btn" onclick="setChip(50, this)">50</button>
            <button class="chip-btn" onclick="setChip(100, this)">100</button>
          </div>
          <div class="action-group">
            <button class="btn-action" id="btn-ip-fold" onclick="ipFold()" disabled>FOLD</button>
            <button class="btn-action" id="btn-ip-raise" onclick="ipRaise()">RAISE BET</button>
            <button class="btn-action btn-main" id="btn-ip-call" onclick="ipShowdown()" disabled>SEE</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // 共通システムコア
    // ==========================================================================
    let globalWallet = 1000;
    let selectedChip = 10;
    let activeScreen = "lobby-screen";

    function updateAllWalletLables() {
      document.querySelectorAll('.wallet-lbl').forEach(el => el.innerText = globalWallet);
    }
    function setChip(val, btn) {
      selectedChip = val;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
    function openGame(id) {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById(id).style.display = 'block';
      activeScreen = id;
      updateAllWalletLables();
      if(id==='bj-screen') bjReset();
      if(id==='ip-screen') ipReset();
    }
    function backToLobby() {
      document.getElementById(activeScreen).style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'flex';
      activeScreen = "lobby-screen";
    }

    // トランプ生成ユーティリティ
    const suits = ['♠','♥','♦','♣'];
    const suitsRed = {'♠':false,'♥':true,'♦':true,'♣':false};
    function createDeck() {
      let deck = [];
      for(let s of suits) {
        for(let v=1; v<=13; v++) deck.push({suit:s, val:v});
      }
      return deck.sort(() => Math.random() - 0.5);
    }
    function makeCardHTML(card, isBack=false) {
      if(isBack) return `<div class="casino-card back">?</div>`;
      let displayV = card.val === 1 ? 'A' : card.val === 11 ? 'J' : card.val === 12 ? 'Q' : card.val === 13 ? 'K' : card.val;
      let redClass = suitsRed[card.suit] ? 'red' : '';
      return `<div class="casino-card ${redClass}"><div>${displayV}</div><div style="align-self:flex-end;">${card.suit}</div></div>`;
    }

    // ==========================================================================
    // 1. SIC BO (大小) ロジック
    // ==========================================================================
    let sbBets = { small: 0, big: 0 };
    let sbLock = false;

    function sbPlace(area) {
      if(sbLock) return;
      if(globalWallet < selectedChip) return;
      globalWallet -= selectedChip;
      sbBets[area] += selectedChip;
      document.getElementById(`sb-pot-${area}`).innerHTML = `<div class="placed-chip">${sbBets[area]}</div>`;
      document.getElementById('sb-bet-total').innerText = sbBets.small + sbBets.big;
      updateAllWalletLables();
    }
    function sbClear() {
      if(sbLock) return;
      globalWallet += (sbBets.small + sbBets.big);
      sbBets = { small: 0, big: 0 };
      document.getElementById('sb-pot-small').innerHTML = '';
      document.getElementById('sb-pot-big').innerHTML = '';
      document.getElementById('sb-bet-total').innerText = 0;
      updateAllWalletLables();
    }
    function sbRoll() {
      if(sbLock || (sbBets.small + sbBets.big === 0)) return;
      sbLock = true;
      document.getElementById('sb-msg').innerText = "SHAKING DICE...";
      document.querySelectorAll('.sb-cell').forEach(c => c.classList.remove('win'));

      let count = 0;
      let interval = setInterval(() => {
        document.getElementById('sb-d1').innerText = Math.floor(Math.random()*6)+1;
        document.getElementById('sb-d2').innerText = Math.floor(Math.random()*6)+1;
        document.getElementById('sb-d3').innerText = Math.floor(Math.random()*6)+1;
        if(++count > 10) {
          clearInterval(interval);
          let d1 = Math.floor(Math.random()*6)+1, d2 = Math.floor(Math.random()*6)+1, d3 = Math.floor(Math.random()*6)+1;
          document.getElementById('sb-d1').innerText = d1;
          document.getElementById('sb-d2').innerText = d2;
          document.getElementById('sb-d3').innerText = d3;
          
          let sum = d1 + d2 + d3;
          let isTriple = (d1 === d2 && d2 === d3);
          let winArea = "";
          if(!isTriple) {
            if(sum >= 4 && sum <= 10) winArea = "small";
            if(sum >= 11 && sum <= 17) winArea = "big";
          }

          let payout = 0;
          if(winArea) {
            document.getElementById(`sb-cell-${winArea}`).classList.add('win');
            if(sbBets[winArea] > 0) payout = sbBets[winArea] * 2;
          }

          globalWallet += payout;
          document.getElementById('sb-msg').innerText = winArea ? `RESULT: ${sum} [${winArea.toUpperCase()}] WIN +${payout}` : `RESULT: ${sum} [TRIPLE] HOUSE WINS`;
          sbBets = { small: 0, big: 0 };
          document.getElementById('sb-pot-small').innerHTML = '';
          document.getElementById('sb-pot-big').innerHTML = '';
          document.getElementById('sb-bet-total').innerText = 0;
          updateAllWalletLables();
          sbLock = false;
        }
      }, 60);
    }

    // ==========================================================================
    // 2. BLACKJACK ロジック
    // ==========================================================================
    let bjDeck, bjPlayer, bjDealer, bjBet = 0, bjState = "betting";

    function bjReset() {
      bjBet = 0; bjState = "betting";
      document.getElementById('bj-pot').innerHTML = '';
      document.getElementById('bj-bet-lbl').innerText = 0;
      document.getElementById('bj-dealer-cards').innerHTML = '';
      document.getElementById('bj-player-cards').innerHTML = '';
      document.getElementById('bj-d-score').innerText = '?';
      document.getElementById('bj-p-score').innerText = 0;
      document.getElementById('bj-msg').innerText = "PLACE BET & DEAL";
      document.getElementById('btn-bj-deal').disabled = false;
      document.getElementById('btn-bj-hit').disabled = true;
      document.getElementById('btn-bj-stand').disabled = true;
    }
    function bjPlace() {
      if(bjState !== "betting" || globalWallet < selectedChip) return;
      globalWallet -= selectedChip; bjBet += selectedChip;
      document.getElementById('bj-pot').innerHTML = `<div class="placed-chip">${bjBet}</div>`;
      document.getElementById('bj-bet-lbl').innerText = bjBet;
      updateAllWalletLables();
    }
    function getBjScore(hand) {
      let score = 0, aces = 0;
      for(let c of hand) {
        let v = c.val;
        if(v > 10) score += 10;
        else if(v === 1) { score += 11; aces++; }
        else score += v;
      }
      while(score > 21 && aces > 0) { score -= 10; aces--; }
      return score;
    }
    function bjDeal() {
      if(bjBet === 0 || bjState !== "betting") return;
      bjState = "playing";
      bjDeck = createDeck();
      bjPlayer = [bjDeck.pop(), bjDeck.pop()];
      bjDealer = [bjDeck.pop(), bjDeck.pop()];

      document.getElementById('btn-bj-deal').disabled = true;
      document.getElementById('btn-bj-hit').disabled = false;
      document.getElementById('btn-bj-stand').disabled = false;
      document.getElementById('bj-msg').innerText = "HIT OR STAND?";

      renderBj();
    }
    function renderBj(showDealer = false) {
      document.getElementById('bj-player-cards').innerHTML = bjPlayer.map(c => makeCardHTML(c)).join('');
      document.getElementById('bj-p-score').innerText = getBjScore(bjPlayer);
      if(showDealer) {
        document.getElementById('bj-dealer-cards').innerHTML = bjDealer.map(c => makeCardHTML(c)).join('');
        document.getElementById('bj-d-score').innerText = getBjScore(bjDealer);
      } else {
        document.getElementById('bj-dealer-cards').innerHTML = makeCardHTML(bjDealer[0]) + makeCardHTML(null, true);
        let firstV = bjDealer[0].val > 10 ? 10 : bjDealer[0].val === 1 ? 11 : bjDealer[0].val;
        document.getElementById('bj-d-score').innerText = firstV;
      }
    }
    function bjHit() {
      bjPlayer.push(bjDeck.pop());
      renderBj();
      if(getBjScore(bjPlayer) > 21) bjEnd("BUST! YOU LOSE.");
    }
    function bjStand() {
      renderBj(true);
      let dScore = getBjScore(bjDealer);
      let interval = setInterval(() => {
        if(dScore < 17) {
          bjDealer.push(bjDeck.pop());
          renderBj(true);
          dScore = getBjScore(bjDealer);
        } else {
          clearInterval(interval);
          let pScore = getBjScore(bjPlayer);
          if(dScore > 21) bjEnd("DEALER BUST! YOU WIN.", 2);
          else if(pScore > dScore) bjEnd("YOU WIN.", 2);
          else if(pScore < dScore) bjEnd("YOU LOSE.");
          else bjEnd("PUSH (DRAW).", 1);
        }
      }, 400);
    }
    function bjEnd(msg, multiplier = 0) {
      document.getElementById('bj-msg').innerText = msg;
      globalWallet += bjBet * multiplier;
      updateAllWalletLables();
      document.getElementById('btn-bj-hit').disabled = true;
      document.getElementById('btn-bj-stand').disabled = true;
      setTimeout(bjReset, 2500);
    }

    // ==========================================================================
    // 3. INDIAN POKER ロジック
    // ==========================================================================
    let ipDeck, ipMyCard, ipOppCard, ipBet = 0, ipState = "betting";

    function ipReset() {
      ipBet = 0; ipState = "betting";
      document.getElementById('ip-bet-lbl').innerText = 0;
      document.getElementById('ip-opp-cards').innerHTML = '';
      document.getElementById('ip-my-cards').innerHTML = '';
      document.getElementById('ip-msg').innerText = "RAISE BET TO START. (A:Weak - K:Strong)";
      document.getElementById('btn-ip-fold').disabled = true;
      document.getElementById('btn-ip-call').disabled = true;
      document.getElementById('btn-ip-raise').disabled = false;
    }
    function ipRaise() {
      if(globalWallet < selectedChip || (ipState !== "betting" && ipState !== "playing")) return;
      globalWallet -= selectedChip; ipBet += selectedChip;
      document.getElementById('ip-bet-lbl').innerText = ipBet;
      updateAllWalletLables();

      if(ipState === "betting") {
        ipState = "playing";
        ipDeck = createDeck();
        ipMyCard = ipDeck.pop();
        ipOppCard = ipDeck.pop();
        document.getElementById('ip-opp-cards').innerHTML = makeCardHTML(ipOppCard);
        document.getElementById('ip-my-cards').innerHTML = makeCardHTML(null, true);
        document.getElementById('btn-ip-fold').disabled = false;
        document.getElementById('btn-ip-call').disabled = false;
        document.getElementById('ip-msg').innerText = "YOU SEE OPPONENT'S CARD. CHOOSE ACTION.";
      }
    }
    function ipFold() {
      document.getElementById('ip-my-cards').innerHTML = makeCardHTML(ipMyCard);
      document.getElementById('ip-msg').innerText = `FOLDED. YOU SURRENDERED ${ipBet} CHIPS.`;
      endIpGame(0);
    }
    function ipShowdown() {
      document.getElementById('ip-my-cards').innerHTML = makeCardHTML(ipMyCard);
      // インディアンポーカーは1(A)が最弱、13(K)が最強
      if(ipMyCard.val > ipOppCard.val) {
        document.getElementById('ip-msg').innerText = `WIN! YOUR CARD IS HIGHER. (+${ipBet * 2})`;
        endIpGame(2);
      } else if(ipMyCard.val < ipOppCard.val) {
        document.getElementById('ip-msg').innerText = "LOSE... YOUR CARD IS LOWER.";
        endIpGame(0);
      } else {
        document.getElementById('ip-msg').innerText = "DRAW (SPLIT POT).";
        endIpGame(1);
      }
    }
    function endIpGame(mult) {
      globalWallet += ipBet * mult;
      updateAllWalletLables();
      document.getElementById('btn-ip-fold').disabled = true;
      document.getElementById('btn-ip-call').disabled = true;
      document.getElementById('btn-ip-raise').disabled = true;
      setTimeout(ipReset, 3000);
    }
  </script>
</body>
</html>
